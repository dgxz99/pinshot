name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Dry-run release version (e.g. v0.1.0, does not publish a GitHub Release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & package Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            libglib2.0-bin \
            desktop-file-utils \
            pango1.0-tools \
            fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests before packaging
        run: |
          cargo test --locked --all-features
          node --test tests/*.mjs
          bash -n scripts/*.sh

      - name: Package release archive
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            ./scripts/package-release.sh "${{ github.ref_name }}" --check-version
          elif [[ -n "${{ inputs.version }}" ]]; then
            ./scripts/package-release.sh "${{ inputs.version }}"
          else
            ./scripts/package-release.sh
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinshot-release-linux-x86_64
          path: |
            dist/pinshot-*.tar.gz
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/pinshot-*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Pinshot ${{ github.ref_name }}" \
            --generate-notes
