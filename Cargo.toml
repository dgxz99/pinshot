[workspace]
resolver = "2"
members = [
    "crates/pinshot-core",
    "crates/pinshot-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["daguo"]
repository = "https://github.com/dgxz99/pinshot"

[workspace.dependencies]
anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = ["screencast", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }
tempfile = "3"
