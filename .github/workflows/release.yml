name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.1; dry-run does not overwrite GitHub Release)'
        required: false
        default: ''
      publish_aur:
        description: 'Also publish this version to AUR (requires AUR_SSH_PRIVATE_KEY secret)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & package Linux x86_64
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      pkgver: ${{ steps.meta.outputs.pkgver }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            libglib2.0-bin \
            desktop-file-utils \
            pango1.0-tools \
            fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests before packaging
        run: |
          cargo test --locked --all-features
          node --test tests/*.mjs
          bash -n scripts/*.sh

      - name: Resolve release version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            CARGO_VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
            VERSION="v${CARGO_VERSION}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "pkgver=${VERSION#v}" >> "${GITHUB_OUTPUT}"

      - name: Package tarball release archive
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            ./scripts/package-release.sh "${{ steps.meta.outputs.version }}" --check-version
          else
            ./scripts/package-release.sh "${{ steps.meta.outputs.version }}"
          fi

      - name: Package Arch Linux .pkg.tar.zst
        run: |
          ARCH_WORK="$(mktemp -d)"
          trap 'rm -rf "${ARCH_WORK}"' EXIT
          cp packaging/aur/pinshot-bin/PKGBUILD packaging/aur/pinshot-bin/pinshot-bin.install "${ARCH_WORK}/"
          cp "dist/pinshot-${{ steps.meta.outputs.version }}-linux-x86_64.tar.gz" "${ARCH_WORK}/"
          sed -i \
            -e "s|^pkgver=.*|pkgver=${{ steps.meta.outputs.pkgver }}|" \
            -e "s|^source_x86_64=.*|source_x86_64=(\"pinshot-${{ steps.meta.outputs.version }}-linux-x86_64.tar.gz\")|" \
            "${ARCH_WORK}/PKGBUILD"
          docker run --rm -v "${ARCH_WORK}:/work" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            archlinux:base-devel bash -euxo pipefail -c '
              groupadd -o -g "${HOST_GID}" builder
              useradd -m -o -u "${HOST_UID}" -g "${HOST_GID}" builder
              su - builder -c "cd /work && makepkg --nodeps --skipchecksums --clean"
            '
          cp "${ARCH_WORK}"/pinshot-bin-*.pkg.tar.zst dist/
          (
            cd dist
            sha256sum pinshot-*.tar.gz pinshot-bin-*.pkg.tar.zst > SHA256SUMS
          )

      - name: Render release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FALLBACK=""
          if [[ ! -f "docs/releases/${{ steps.meta.outputs.version }}.md" && "${{ github.event_name }}" == "push" ]]; then
            FALLBACK="dist/AUTO_NOTES.md"
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${{ steps.meta.outputs.version }}" \
              --jq .body > "${FALLBACK}" || true
          fi
          ./scripts/render-release-notes.sh "${{ steps.meta.outputs.version }}" dist dist/RELEASE_NOTES.md "${FALLBACK}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinshot-release-linux-x86_64
          path: |
            dist/pinshot-*.tar.gz
            dist/pinshot-bin-*.pkg.tar.zst
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/pinshot-*.tar.gz \
            dist/pinshot-bin-*.pkg.tar.zst \
            dist/SHA256SUMS \
            --verify-tag \
            --title "Pinshot ${{ github.ref_name }}" \
            --notes-file dist/RELEASE_NOTES.md

  publish-aur:
    name: Publish AUR (pinshot & pinshot-bin)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_aur)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish pinshot and pinshot-bin to AUR
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PKGVER: ${{ needs.release.outputs.pkgver }}
          REPO: ${{ github.repository }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          set -euo pipefail

          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY secret is not configured; skipping AUR publish."
            exit 0
          fi

          WORK_DIR="$(mktemp -d)"
          SSH_DIR="${WORK_DIR}/ssh"
          mkdir -p "${SSH_DIR}"
          chmod 700 "${SSH_DIR}"
          trap 'rm -rf "${WORK_DIR}"' EXIT

          KEY_FILE="${SSH_DIR}/aur_key"
          KNOWN_HOSTS="${SSH_DIR}/known_hosts"
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          ssh-keyscan -t ed25519,rsa aur.archlinux.org > "${KNOWN_HOSTS}" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o UserKnownHostsFile=${KNOWN_HOSTS} -o StrictHostKeyChecking=yes"

          GIT_NAME="${AUR_USERNAME:-daguo}"
          GIT_EMAIL="${AUR_EMAIL:-dgxz99@users.noreply.github.com}"

          SRC_URL="https://github.com/${REPO}/archive/refs/tags/${VERSION}.tar.gz"
          BIN_URL="https://github.com/${REPO}/releases/download/${VERSION}/pinshot-${VERSION}-linux-x86_64.tar.gz"

          curl -fsSL --retry 5 --retry-delay 5 "${SRC_URL}" -o "${WORK_DIR}/src.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 "${BIN_URL}" -o "${WORK_DIR}/bin.tar.gz"
          SRC_SHA="$(sha256sum "${WORK_DIR}/src.tar.gz" | awk '{print $1}')"
          BIN_SHA="$(sha256sum "${WORK_DIR}/bin.tar.gz" | awk '{print $1}')"

          publish_pkg() {
            local pkg="$1" sha_key="$2" sha_val="$3"
            local aur_dir="${WORK_DIR}/aur-${pkg}"

            git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "${aur_dir}"
            cp "packaging/aur/${pkg}/PKGBUILD" "packaging/aur/${pkg}/${pkg}.install" "${aur_dir}/"

            sed -i \
              -e '/updpkgsums/d' \
              -e "s|^pkgver=.*|pkgver=${PKGVER}|" \
              -e "s|^pkgrel=.*|pkgrel=1|" \
              -e "s|^${sha_key}=.*|${sha_key}=('${sha_val}')|" \
              "${aur_dir}/PKGBUILD"

            docker run --rm -v "${aur_dir}:/work" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
              archlinux:base-devel bash -euo pipefail -c '
                groupadd -o -g "${HOST_GID}" builder
                useradd -m -o -u "${HOST_UID}" -g "${HOST_GID}" builder
                su - builder -c "cd /work && makepkg --printsrcinfo > .SRCINFO"
              '

            (
              cd "${aur_dir}"
              git config user.name "${GIT_NAME}"
              git config user.email "${GIT_EMAIL}"
              git add PKGBUILD "${pkg}.install" .SRCINFO
              if git diff --cached --quiet; then
                echo "No changes to publish for ${pkg} (${VERSION})."
              else
                git commit -m "Update to ${VERSION}"
                git push origin HEAD:master
                echo "Published ${pkg} ${VERSION} to AUR."
              fi
            )
          }

          publish_pkg "pinshot" "sha256sums" "${SRC_SHA}"
          publish_pkg "pinshot-bin" "sha256sums_x86_64" "${BIN_SHA}"
